name: Auto-Update

on:
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allow manual triggers

permissions:
  contents: write        # Required for creating commits
  pull-requests: write   # Required for creating and merging PRs

jobs:
  check-versions:
    name: Check for outdated packages
    runs-on: macos-latest
    outputs:
      outdated_items: ${{ steps.check.outputs.outdated_items }}
      has_updates: ${{ steps.check.outputs.has_updates }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Homebrew
        id: set-up-homebrew
        run: |
          echo "Homebrew already installed on macOS runner"
          brew --version

      - name: Tap this repository
        run: |
          brew tap impuls42/tap "$(pwd)"

      - name: Check for outdated packages
        id: check
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          set -e

          # Run livecheck and capture output
          LIVECHECK_OUTPUT=$(brew livecheck --json --tap impuls42/tap --newer-only 2>&1) || true
          echo "Livecheck output: $LIVECHECK_OUTPUT"

          # Use the check-outdated.sh script to parse results
          chmod +x .github/scripts/check-outdated.sh
          OUTDATED_ITEMS=$(.github/scripts/check-outdated.sh "$LIVECHECK_OUTPUT")

          echo "Outdated items: $OUTDATED_ITEMS"
          echo "outdated_items=$OUTDATED_ITEMS" >> $GITHUB_OUTPUT

          # Check if we have any updates
          if [ "$OUTDATED_ITEMS" = "[]" ] || [ -z "$OUTDATED_ITEMS" ]; then
            echo "has_updates=false" >> $GITHUB_OUTPUT
          else
            echo "has_updates=true" >> $GITHUB_OUTPUT
          fi

      - name: Summary
        run: |
          echo "### Version Check Results" >> $GITHUB_STEP_SUMMARY
          echo "Outdated items: ${{ steps.check.outputs.outdated_items }}" >> $GITHUB_STEP_SUMMARY
          echo "Has updates: ${{ steps.check.outputs.has_updates }}" >> $GITHUB_STEP_SUMMARY

  update-package:
    name: Update ${{ matrix.item.name }} (${{ matrix.item.type }})
    needs: check-versions
    if: needs.check-versions.outputs.has_updates == 'true'
    runs-on: macos-latest
    strategy:
      matrix:
        item: ${{ fromJson(needs.check-versions.outputs.outdated_items) }}
      fail-fast: false  # Continue with other packages if one fails
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Homebrew
        run: |
          echo "Homebrew already installed on macOS runner"
          brew --version

      - name: Tap this repository
        run: |
          brew tap impuls42/tap "$(pwd)"

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get latest version
        id: get_version
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          set -e

          # Get the latest version from livecheck
          # Use appropriate flag based on type
          if [ "${{ matrix.item.type }}" = "formula" ]; then
            LIVECHECK_JSON=$(brew livecheck --json --formula ${{ matrix.item.name }} --newer-only 2>&1) || true
          else
            LIVECHECK_JSON=$(brew livecheck --json --cask ${{ matrix.item.name }} --newer-only 2>&1) || true
          fi
          echo "Livecheck JSON: $LIVECHECK_JSON"

          # Extract the latest version using jq
          # Handle both JSON starting with [ or mixed output
          LATEST_VERSION=$(echo "$LIVECHECK_JSON" | sed -n '/^\[/,/^\]/p' | jq -r '.[0].version.latest // empty' 2>/dev/null || echo "")

          if [ -z "$LATEST_VERSION" ]; then
            echo "ERROR: Could not determine latest version for ${{ matrix.item.name }}"
            exit 1
          fi

          echo "Latest version: $LATEST_VERSION"
          echo "version=$LATEST_VERSION" >> $GITHUB_OUTPUT

      - name: Create update PR
        id: create_pr
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          # Make script executable
          chmod +x .github/scripts/create-update-pr.sh

          # Run the update script with name, version, and type
          .github/scripts/create-update-pr.sh "${{ matrix.item.name }}" "${{ steps.get_version.outputs.version }}" "${{ matrix.item.type }}"

      - name: Summary
        if: always()
        run: |
          echo "### Update Results for ${{ matrix.item.name }} (${{ matrix.item.type }})" >> $GITHUB_STEP_SUMMARY
          echo "Target version: ${{ steps.get_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "Status: PR created successfully (will be validated and merged by separate workflow)" >> $GITHUB_STEP_SUMMARY
          else
            echo "Status: Failed to create PR" >> $GITHUB_STEP_SUMMARY
          fi
