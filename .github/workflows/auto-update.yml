name: Auto-Update

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Trust our own tap so brew can load/audit/install formulae that reference
# other formulae in this tap (e.g. conflicts_with between spotctl & spotctl-mcp).
env:
  HOMEBREW_NO_REQUIRE_TAP_TRUST: 1

jobs:
  check-versions:
    name: Check for outdated packages
    runs-on: macos-latest
    outputs:
      outdated_items: ${{ steps.check.outputs.outdated_items }}
      has_updates: ${{ steps.check.outputs.has_updates }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tap

      - name: Check for outdated packages
        id: check
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          LIVECHECK_OUTPUT=$(brew livecheck --json --tap impuls42/tap --newer-only 2>&1) || true

          # Strip ANSI codes, extract JSON array, filter outdated items
          OUTDATED_ITEMS=$(echo "$LIVECHECK_OUTPUT" \
            | sed $'s/\x1b\\[[0-9;]*m//g' \
            | sed -n '/^\[/,/^\]/p' \
            | jq -c '[.[] | select(.version.outdated==true)
                | if .cask then {name:.cask,type:"cask"} else {name:.formula,type:"formula"} end]
                | unique_by(.name)' 2>/dev/null || echo "[]")

          [ -z "$OUTDATED_ITEMS" ] || [ "$OUTDATED_ITEMS" = "null" ] && OUTDATED_ITEMS="[]"

          echo "Outdated items: $OUTDATED_ITEMS"
          echo "outdated_items=$OUTDATED_ITEMS" >> $GITHUB_OUTPUT

          if [ "$OUTDATED_ITEMS" = "[]" ]; then
            echo "has_updates=false" >> $GITHUB_OUTPUT
          else
            echo "has_updates=true" >> $GITHUB_OUTPUT
          fi

      - name: Summary
        run: |
          echo "### Version Check Results" >> $GITHUB_STEP_SUMMARY
          echo "Outdated items: ${{ steps.check.outputs.outdated_items }}" >> $GITHUB_STEP_SUMMARY
          echo "Has updates: ${{ steps.check.outputs.has_updates }}" >> $GITHUB_STEP_SUMMARY

  update-package:
    name: Update ${{ matrix.item.name }} (${{ matrix.item.type }})
    needs: check-versions
    if: needs.check-versions.outputs.has_updates == 'true'
    runs-on: macos-latest
    strategy:
      matrix:
        item: ${{ fromJson(needs.check-versions.outputs.outdated_items) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tap

      - name: Get latest version
        id: version
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ matrix.item.type }}" = "cask" ]; then
            TYPE_FLAG="--cask"
          else
            TYPE_FLAG="--formula"
          fi

          LIVECHECK_JSON=$(brew livecheck --json $TYPE_FLAG "impuls42/tap/${{ matrix.item.name }}" --newer-only 2>&1) || true
          LATEST=$(echo "$LIVECHECK_JSON" | sed -n '/^\[/,/^\]/p' | jq -r '.[0].version.latest // empty' 2>/dev/null || echo "")

          if [ -z "$LATEST" ]; then
            echo "Could not determine latest version for ${{ matrix.item.name }}"
            exit 1
          fi

          echo "Latest version: $LATEST"
          echo "version=$LATEST" >> $GITHUB_OUTPUT

      - name: Get current version
        id: current
        run: |
          if [ "${{ matrix.item.type }}" = "formula" ]; then
            FILE="Formula/${{ matrix.item.name }}.rb"
          else
            FILE="Casks/${{ matrix.item.name }}.rb"
          fi
          VERSION=$(grep -E '^\s*version\s+"[^"]+"' "$FILE" | sed -E 's/.*version\s+"([^"]+)".*/\1/' || echo "unknown")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Bump version
        id: bump
        uses: ./.github/actions/bump-package
        with:
          name: ${{ matrix.item.name }}
          version: ${{ steps.version.outputs.version }}
          type: ${{ matrix.item.type }}

      - name: Create or update PR
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          NAME="${{ matrix.item.name }}"
          VERSION="${{ steps.version.outputs.version }}"
          CURRENT="${{ steps.current.outputs.version }}"
          TYPE="${{ matrix.item.type }}"
          TYPE_DISPLAY=$(echo "$TYPE" | sed 's/^./\U&/')

          if [ "$TYPE" = "formula" ]; then
            FILE="Formula/${NAME}.rb"
          else
            FILE="Casks/${NAME}.rb"
          fi

          # Check for changes
          if git diff --quiet "$FILE"; then
            echo "No changes detected in $FILE"
            exit 0
          fi

          echo "Changes made:"
          git diff "$FILE"

          BRANCH="automated-update/${NAME}-${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH" 2>/dev/null || git checkout "$BRANCH"

          MACOS_UPDATED="${{ steps.bump.outputs.macos_updated }}"
          OLD_MACOS="${{ steps.bump.outputs.old_macos_version }}"
          NEW_MACOS="${{ steps.bump.outputs.new_macos_version }}"

          MACOS_COMMIT_LINE=""
          if [ "$MACOS_UPDATED" = "true" ]; then
            MACOS_COMMIT_LINE="
          - Bumped minimum macOS requirement from :$OLD_MACOS to :$NEW_MACOS"
          fi

          git add "$FILE"
          git commit -m "Update $NAME to version $VERSION

          Automated update via GitHub Actions.

          - Updated version from $CURRENT to $VERSION
          - Updated SHA256 checksums${MACOS_COMMIT_LINE}

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

          git push -u origin "$BRANCH" --force

          PR_TITLE="Update $NAME to version $VERSION"

          MACOS_PR_LINE=""
          if [ "$MACOS_UPDATED" = "true" ]; then
            MACOS_PR_LINE="
          - Bumped minimum macOS requirement from \`:$OLD_MACOS\` to \`:$NEW_MACOS\`"
          fi

          PR_BODY="## Automated ${TYPE_DISPLAY} Update

          **${TYPE_DISPLAY}**: \`$NAME\`
          **Previous Version**: \`$CURRENT\`
          **New Version**: \`$VERSION\`

          ### Changes
          - Updated version string
          - Updated SHA256 checksums for all architectures
          - Verified download URLs${MACOS_PR_LINE}

          ---
          Generated by [GitHub Actions Auto-Update Workflow](https://github.com/${{ github.repository }}/actions)"

          EXISTING_PR=$(gh pr list --head "$BRANCH" --base main --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" --title "$PR_TITLE" --body "$PR_BODY"
            echo "Updated PR #$EXISTING_PR"
          else
            gh pr create --title "$PR_TITLE" --body "$PR_BODY" --base main --head "$BRANCH" --label "automatic"
            echo "Created new PR"
          fi

      - name: Summary
        if: always()
        run: |
          echo "### Update Results for ${{ matrix.item.name }} (${{ matrix.item.type }})" >> $GITHUB_STEP_SUMMARY
          echo "Target version: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
