name: Test Packages

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Package name to test (leave empty to test all)'
        required: false
        type: string
      package_type:
        description: 'Package type'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - cask
          - formula
  pull_request:
    paths:
      - 'Casks/**'
      - 'Formula/**'
  push:
    branches:
      - main
    paths:
      - 'Casks/**'
      - 'Formula/**'

permissions:
  contents: read

jobs:
  detect-packages:
    name: Detect Packages to Test
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.detect.outputs.packages }}
      has_packages: ${{ steps.detect.outputs.has_packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect packages
        id: detect
        run: |
          set -e

          PACKAGES="[]"

          # If specific package is provided via workflow_dispatch
          if [ -n "${{ inputs.package_name }}" ]; then
            TYPE="${{ inputs.package_type }}"
            NAME="${{ inputs.package_name }}"

            if [ "$TYPE" = "all" ]; then
              if [ -f "Casks/${NAME}.rb" ]; then
                PACKAGES=$(echo "$PACKAGES" | jq -c '. + [{name: "'$NAME'", type: "cask"}]')
              fi
              if [ -f "Formula/${NAME}.rb" ]; then
                PACKAGES=$(echo "$PACKAGES" | jq -c '. + [{name: "'$NAME'", type: "formula"}]')
              fi
            elif [ "$TYPE" = "cask" ] && [ -f "Casks/${NAME}.rb" ]; then
              PACKAGES='[{"name":"'$NAME'","type":"cask"}]'
            elif [ "$TYPE" = "formula" ] && [ -f "Formula/${NAME}.rb" ]; then
              PACKAGES='[{"name":"'$NAME'","type":"formula"}]'
            fi
          # If triggered by PR or push, detect changed files
          elif [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.event_name }}" = "push" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              BASE_SHA="${{ github.event.pull_request.base.sha }}"
              HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            else
              BASE_SHA="${{ github.event.before }}"
              HEAD_SHA="${{ github.sha }}"
            fi

            CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || echo "")

            CASK_FILES=$(echo "$CHANGED_FILES" | grep -E '^Casks/.*\.rb$' || echo "")
            FORMULA_FILES=$(echo "$CHANGED_FILES" | grep -E '^Formula/.*\.rb$' || echo "")

            for file in $CASK_FILES; do
              name=$(basename "$file" .rb)
              PACKAGES=$(echo "$PACKAGES" | jq -c '. + [{name: "'$name'", type: "cask"}]')
            done

            for file in $FORMULA_FILES; do
              name=$(basename "$file" .rb)
              PACKAGES=$(echo "$PACKAGES" | jq -c '. + [{name: "'$name'", type: "formula"}]')
            done
          # Otherwise test all packages
          else
            for file in Casks/*.rb; do
              if [ -f "$file" ]; then
                name=$(basename "$file" .rb)
                PACKAGES=$(echo "$PACKAGES" | jq -c '. + [{name: "'$name'", type: "cask"}]')
              fi
            done

            for file in Formula/*.rb; do
              if [ -f "$file" ]; then
                name=$(basename "$file" .rb)
                PACKAGES=$(echo "$PACKAGES" | jq -c '. + [{name: "'$name'", type: "formula"}]')
              fi
            done
          fi

          echo "Packages to test: $PACKAGES"
          echo "packages=$PACKAGES" >> $GITHUB_OUTPUT

          if [ "$PACKAGES" = "[]" ]; then
            echo "has_packages=false" >> $GITHUB_OUTPUT
          else
            echo "has_packages=true" >> $GITHUB_OUTPUT
          fi

  test-package:
    name: Test ${{ matrix.package.name }} (${{ matrix.package.type }})
    needs: detect-packages
    if: needs.detect-packages.outputs.has_packages == 'true'
    runs-on: macos-latest
    strategy:
      matrix:
        package: ${{ fromJson(needs.detect-packages.outputs.packages) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tap

      - name: Validate package
        uses: ./.github/actions/validate-package
        with:
          name: ${{ matrix.package.name }}
          type: ${{ matrix.package.type }}
          run-livecheck: 'true'

      - name: Summary
        if: always()
        run: |
          echo "### Test Results for ${{ matrix.package.name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Type**: ${{ matrix.package.type }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
