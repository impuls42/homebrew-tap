name: Test Packages

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Package name to test (leave empty to test all)'
        required: false
        type: string
      package_type:
        description: 'Package type'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - cask
          - formula
  pull_request:
    paths:
      - 'Casks/**'
      - 'Formula/**'
  push:
    branches:
      - main
    paths:
      - 'Casks/**'
      - 'Formula/**'

permissions:
  contents: read

jobs:
  detect-packages:
    name: Detect Packages to Test
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.detect.outputs.packages }}
      has_packages: ${{ steps.detect.outputs.has_packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for changed files detection

      - name: Detect packages
        id: detect
        run: |
          set -e

          PACKAGES="[]"

          # If specific package is provided via workflow_dispatch
          if [ -n "${{ inputs.package_name }}" ]; then
            TYPE="${{ inputs.package_type }}"
            NAME="${{ inputs.package_name }}"
            
            if [ "$TYPE" = "all" ]; then
              # Check both cask and formula
              if [ -f "Casks/${NAME}.rb" ]; then
                PACKAGES=$(echo "$PACKAGES" | jq -c '. + [{name: "'$NAME'", type: "cask"}]')
              fi
              if [ -f "Formula/${NAME}.rb" ]; then
                PACKAGES=$(echo "$PACKAGES" | jq -c '. + [{name: "'$NAME'", type: "formula"}]')
              fi
            elif [ "$TYPE" = "cask" ] && [ -f "Casks/${NAME}.rb" ]; then
              PACKAGES='[{"name":"'$NAME'","type":"cask"}]'
            elif [ "$TYPE" = "formula" ] && [ -f "Formula/${NAME}.rb" ]; then
              PACKAGES='[{"name":"'$NAME'","type":"formula"}]'
            fi
          # If triggered by PR or push, detect changed files
          elif [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.event_name }}" = "push" ]; then
            # Get changed files
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              BASE_SHA="${{ github.event.pull_request.base.sha }}"
              HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            else
              BASE_SHA="${{ github.event.before }}"
              HEAD_SHA="${{ github.sha }}"
            fi

            CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || echo "")
            
            # Find changed casks and formulas
            CASK_FILES=$(echo "$CHANGED_FILES" | grep -E '^Casks/.*\.rb$' || echo "")
            FORMULA_FILES=$(echo "$CHANGED_FILES" | grep -E '^Formula/.*\.rb$' || echo "")
            
            # Build packages array
            for file in $CASK_FILES; do
              name=$(basename "$file" .rb)
              PACKAGES=$(echo "$PACKAGES" | jq -c '. + [{name: "'$name'", type: "cask"}]')
            done
            
            for file in $FORMULA_FILES; do
              name=$(basename "$file" .rb)
              PACKAGES=$(echo "$PACKAGES" | jq -c '. + [{name: "'$name'", type: "formula"}]')
            done
          # Otherwise test all packages
          else
            # List all casks
            for file in Casks/*.rb; do
              if [ -f "$file" ]; then
                name=$(basename "$file" .rb)
                PACKAGES=$(echo "$PACKAGES" | jq -c '. + [{name: "'$name'", type: "cask"}]')
              fi
            done
            
            # List all formulas
            for file in Formula/*.rb; do
              if [ -f "$file" ]; then
                name=$(basename "$file" .rb)
                PACKAGES=$(echo "$PACKAGES" | jq -c '. + [{name: "'$name'", type: "formula"}]')
              fi
            done
          fi

          echo "Packages to test: $PACKAGES"
          echo "packages=$PACKAGES" >> $GITHUB_OUTPUT

          if [ "$PACKAGES" = "[]" ]; then
            echo "has_packages=false" >> $GITHUB_OUTPUT
          else
            echo "has_packages=true" >> $GITHUB_OUTPUT
          fi

  test-package:
    name: Test ${{ matrix.package.name }} (${{ matrix.package.type }})
    needs: detect-packages
    if: needs.detect-packages.outputs.has_packages == 'true'
    runs-on: macos-latest
    strategy:
      matrix:
        package: ${{ fromJson(needs.detect-packages.outputs.packages) }}
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Homebrew
        run: |
          echo "Homebrew already installed on macOS runner"
          brew --version

      - name: Tap this repository
        run: |
          brew tap impuls42/tap "$(pwd)"

      - name: Run brew audit
        run: |
          set -e
          
          if [ "${{ matrix.package.type }}" = "cask" ]; then
            echo "Running: brew audit --cask ${{ matrix.package.name }}"
            brew audit --cask "${{ matrix.package.name }}"
          else
            echo "Running: brew audit --formula ${{ matrix.package.name }}"
            brew audit --formula "${{ matrix.package.name }}"
          fi
          
          echo "✅ Audit passed"

      - name: Run brew style
        run: |
          set -e
          
          echo "Running: brew style ${{ matrix.package.name }}"
          brew style "${{ matrix.package.name }}"
          
          echo "✅ Style check passed"

      - name: Install build dependencies
        run: |
          set -e
          
          # Get all build dependencies for the formula
          BUILD_DEPS=$(brew deps --include-build "${{ matrix.package.name }}" 2>/dev/null || echo "")
          
          # Install each build dependency
          if [ -n "$BUILD_DEPS" ]; then
            echo "Installing build dependencies: $BUILD_DEPS"
            for dep in $BUILD_DEPS; do
              echo "  Installing: $dep"
              brew install "$dep" || echo "⚠️  Warning: Failed to install $dep (may already be installed)"
            done
            echo "✅ Build dependencies installed"
          else
            echo "ℹ️  No build dependencies detected"
          fi

      - name: Test installation
        id: install
        run: |
          set -e

          echo "Testing installation of ${{ matrix.package.name }}..."

          if [ "${{ matrix.package.type }}" = "cask" ]; then
            echo "Running: brew install --cask ${{ matrix.package.name }}"
            brew install --cask "${{ matrix.package.name }}"
            echo "✅ Cask installed successfully"
            echo "installed=true" >> $GITHUB_OUTPUT
          else
            echo "Running: brew install ${{ matrix.package.name }}"
            
            # For formulas, attempt installation with verbose output
            if brew install -v "${{ matrix.package.name }}"; then
              echo "✅ Formula installed successfully"
              echo "installed=true" >> $GITHUB_OUTPUT
            else
              echo "❌ Installation failed"
              echo ""
              echo "Debug: Checking Homebrew cache for build output..."
              find $(brew --cache) -type f -name "*${{ matrix.package.name }}*" 2>/dev/null || true
              exit 1
            fi
          fi

      - name: Test binary/app exists
        if: steps.install.outputs.installed == 'true'
        run: |
          set -e

          if [ "${{ matrix.package.type }}" = "cask" ]; then
            # For casks, check if app or binary was installed
            # This is a basic check - might need customization per package
            echo "Verifying cask installation..."
            brew list --cask "${{ matrix.package.name }}"
            echo "✅ Cask verified"
          else
            # For formulas, check if binary exists
            echo "Verifying formula installation..."
            brew list --formula "${{ matrix.package.name }}"
            echo "✅ Formula verified"
          fi

      - name: Cleanup
        if: always() && steps.install.outputs.installed == 'true'
        run: |
          echo "Cleaning up..."
          
          if [ "${{ matrix.package.type }}" = "cask" ]; then
            brew uninstall --cask "${{ matrix.package.name }}" 2>/dev/null || true
          else
            brew uninstall --formula "${{ matrix.package.name }}" 2>/dev/null || true
          fi
          
          echo "✅ Cleanup complete"

      - name: Summary
        if: always()
        run: |
          echo "### Test Results for ${{ matrix.package.name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Type**: ${{ matrix.package.type }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
