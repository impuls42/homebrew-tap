# This workflow validates and automatically merges PRs with the "automatic" label
# 
# Prerequisites for full automation:
# 1. Repository Settings → Actions → General → Workflow permissions:
#    - Enable "Allow GitHub Actions to create and approve pull requests"
# 2. Repository Settings → General → Pull Requests:
#    - Enable "Allow auto-merge"
# 3. (Optional) Branch protection: Don't require approvals, or set to 0 required reviewers
#
# The workflow will still work without these settings, but will require manual approval.
#
# Security Note:
# This workflow uses workflow_run trigger which checks out PR code.
# Security measures in place:
# - Only processes PRs with "automatic" label (controlled by Auto-Update workflow)
# - Only processes PRs from the same repository (not forks)
# - Runs validation (brew audit, brew style) before any approval
# - No arbitrary code execution; only Homebrew tooling

name: PR Auto-Merge

on:
  # Trigger when Auto-Update workflow completes
  # This solves the issue where GITHUB_TOKEN can't trigger workflows on PRs it creates
  workflow_run:
    workflows: ["Auto-Update"]
    types:
      - completed
  
  # Keep these triggers for manual operations and edge cases
  pull_request:
    types: [opened, synchronize, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Job to find PRs when triggered by workflow_run
  find-prs:
    name: Find PRs to Process
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    outputs:
      pr_numbers: ${{ steps.find.outputs.pr_numbers }}
      has_prs: ${{ steps.find.outputs.has_prs }}
    steps:
      - name: Find open PRs with automatic label
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Find all open PRs with the "automatic" label
          PR_NUMBERS=$(gh pr list \
            --repo ${{ github.repository }} \
            --state open \
            --label "automatic" \
            --json number \
            --jq '[.[].number]')
          
          echo "Found PRs: $PR_NUMBERS"
          echo "pr_numbers=$PR_NUMBERS" >> $GITHUB_OUTPUT
          
          # Check if we have any PRs
          if [ "$PR_NUMBERS" = "[]" ] || [ -z "$PR_NUMBERS" ]; then
            echo "has_prs=false" >> $GITHUB_OUTPUT
          else
            echo "has_prs=true" >> $GITHUB_OUTPUT
          fi

  validate-and-merge:
    name: Validate and Auto-Merge
    needs: find-prs
    if: |
      always() && 
      ((github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'automatic')) ||
       (github.event_name == 'workflow_run' && needs.find-prs.outputs.has_prs == 'true'))
    runs-on: macos-latest
    strategy:
      matrix:
        # Matrix strategy to handle both trigger types:
        # - workflow_run: process array of PR numbers from find-prs job
        # - pull_request: process single PR number from event
        pr_number: ${{ github.event_name == 'workflow_run' && fromJson(needs.find-prs.outputs.pr_numbers) || fromJson(format('[{0}]', github.event.pull_request.number)) }}
      fail-fast: false
    steps:
      - name: Get PR details
        id: pr_details
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_DATA=$(gh pr view ${{ matrix.pr_number }} \
            --repo ${{ github.repository }} \
            --json headRefName,headRefOid,labels,headRepository)
          
          HEAD_REF=$(echo "$PR_DATA" | jq -r '.headRefName')
          HEAD_SHA=$(echo "$PR_DATA" | jq -r '.headRefOid')
          HAS_LABEL=$(echo "$PR_DATA" | jq -r '[.labels[].name] | contains(["automatic"])')
          # For same-repo PRs, headRepository is null, so we default to the current repository
          HEAD_REPO=$(echo "$PR_DATA" | jq -r '.headRepository.nameWithOwner // empty')
          if [ -z "$HEAD_REPO" ]; then
            HEAD_REPO="${{ github.repository }}"
          fi
          
          echo "head_ref=$HEAD_REF" >> $GITHUB_OUTPUT
          echo "head_sha=$HEAD_SHA" >> $GITHUB_OUTPUT
          echo "has_automatic_label=$HAS_LABEL" >> $GITHUB_OUTPUT
          echo "head_repo=$HEAD_REPO" >> $GITHUB_OUTPUT
          echo "is_same_repo=$([[ \"$HEAD_REPO\" == \"${{ github.repository }}\" ]] && echo true || echo false)" >> $GITHUB_OUTPUT

      # Security check: Only process PRs from the same repository (not forks)
      # This prevents execution of untrusted code from forked PRs
      - name: Skip if PR from fork
        if: steps.pr_details.outputs.is_same_repo != 'true'
        run: |
          echo "::notice::PR #${{ matrix.pr_number }} is from a fork (${{ steps.pr_details.outputs.head_repo }}), blocking workflow execution for security"
          exit 1

      # Early exit if PR doesn't have automatic label
      # This can happen if the label was removed after the workflow started
      - name: Skip if no automatic label
        if: steps.pr_details.outputs.has_automatic_label != 'true'
        run: |
          echo "::notice::PR #${{ matrix.pr_number }} does not have 'automatic' label, blocking workflow execution"
          exit 1

      - name: Checkout repository
        if: steps.pr_details.outputs.has_automatic_label == 'true' && steps.pr_details.outputs.is_same_repo == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr_details.outputs.head_sha }}

      - name: Set up Homebrew
        if: steps.pr_details.outputs.has_automatic_label == 'true' && steps.pr_details.outputs.is_same_repo == 'true'
        run: |
          echo "Homebrew already installed on macOS runner"
          brew --version

      - name: Tap this repository
        if: steps.pr_details.outputs.has_automatic_label == 'true' && steps.pr_details.outputs.is_same_repo == 'true'
        run: |
          brew tap impuls42/tap "$(pwd)"

      - name: Detect changed cask or formula
        if: steps.pr_details.outputs.has_automatic_label == 'true' && steps.pr_details.outputs.is_same_repo == 'true'
        id: detect
        run: |
          set -e

          # Get the list of changed files
          CHANGED_FILES=$(gh pr diff ${{ matrix.pr_number }} --repo ${{ github.repository }} --name-only)
          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Find the cask or formula that was changed
          CASK_FILE=$(echo "$CHANGED_FILES" | grep -E '^Casks/.*\.rb$' | head -1 || echo "")
          FORMULA_FILE=$(echo "$CHANGED_FILES" | grep -E '^Formula/.*\.rb$' | head -1 || echo "")

          if [ -n "$CASK_FILE" ]; then
            NAME=$(basename "$CASK_FILE" .rb)
            TYPE="cask"
            AUDIT_FLAG="--cask"
          elif [ -n "$FORMULA_FILE" ]; then
            NAME=$(basename "$FORMULA_FILE" .rb)
            TYPE="formula"
            AUDIT_FLAG="--formula"
          else
            echo "ERROR: No cask or formula file found in PR changes"
            exit 1
          fi

          echo "Detected $TYPE: $NAME"
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "type=$TYPE" >> $GITHUB_OUTPUT
          echo "audit_flag=$AUDIT_FLAG" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run brew audit
        if: steps.pr_details.outputs.has_automatic_label == 'true' && steps.pr_details.outputs.is_same_repo == 'true'
        id: audit
        run: |
          set -e

          echo "Running: brew audit ${{ steps.detect.outputs.audit_flag }} impuls42/tap/${{ steps.detect.outputs.name }}"
          echo ""

          brew audit ${{ steps.detect.outputs.audit_flag }} "impuls42/tap/${{ steps.detect.outputs.name }}"

          echo ""
          echo "Audit passed"

      - name: Run brew style
        if: steps.pr_details.outputs.has_automatic_label == 'true' && steps.pr_details.outputs.is_same_repo == 'true'
        run: |
          set -e

          echo "Running: brew style impuls42/tap/${{ steps.detect.outputs.name }}"
          echo ""

          brew style "impuls42/tap/${{ steps.detect.outputs.name }}"

          echo ""
          echo "Style check passed"

      - name: Test installation
        if: steps.pr_details.outputs.has_automatic_label == 'true' && steps.pr_details.outputs.is_same_repo == 'true'
        id: install_test
        run: |
          set -e

          echo "Testing installation of ${{ steps.detect.outputs.name }}..."
          echo ""

          if [ "${{ steps.detect.outputs.type }}" = "cask" ]; then
            echo "Running: brew install --cask impuls42/tap/${{ steps.detect.outputs.name }}"
            brew install --cask "impuls42/tap/${{ steps.detect.outputs.name }}"
            echo "installed=true" >> $GITHUB_OUTPUT
          else
            echo "Running: brew install impuls42/tap/${{ steps.detect.outputs.name }}"
            # For formulas, we need to handle build dependencies
            # Some formulas like firefox-webserial require platformio which may not be available
            if brew install "impuls42/tap/${{ steps.detect.outputs.name }}"; then
              echo "installed=true" >> $GITHUB_OUTPUT
            else
              echo "Installation failed - checking if this is due to unavailable build dependencies..."
              
              # Check if the formula depends on platformio or other unavailable tools
              BUILD_DEPS=$(brew deps --include-build "impuls42/tap/${{ steps.detect.outputs.name }}" 2>/dev/null || echo "")
              if echo "$BUILD_DEPS" | grep -q "^platformio$"; then
                echo "Formula requires PlatformIO which is not available in CI environment"
                echo "Skipping installation test - formula syntax and style have been validated"
                echo "installed=false" >> $GITHUB_OUTPUT
                exit 0
              else
                echo "Installation failed unexpectedly"
                exit 1
              fi
            fi
          fi

          echo ""
          echo "Installation test passed"

      - name: Cleanup test installation
        if: always() && steps.install_test.outputs.installed == 'true'
        run: |
          echo "Cleaning up test installation..."
          
          if [ "${{ steps.detect.outputs.type }}" = "cask" ]; then
            brew uninstall --cask "impuls42/tap/${{ steps.detect.outputs.name }}" 2>/dev/null || true
          else
            brew uninstall "impuls42/tap/${{ steps.detect.outputs.name }}" 2>/dev/null || true
          fi
          
          echo "Cleanup complete"

      - name: Add success comment
        if: success() && steps.pr_details.outputs.has_automatic_label == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMENT="## ✅ Validation Passed

          All checks passed successfully:

          - \`brew audit ${{ steps.detect.outputs.audit_flag }} impuls42/tap/${{ steps.detect.outputs.name }}\` - **Passed**
          - \`brew style impuls42/tap/${{ steps.detect.outputs.name }}\` - **Passed**
          - Installation test - **Passed**

          This PR will be automatically approved and merged.

          ---
          [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"

          gh pr comment ${{ matrix.pr_number }} --repo ${{ github.repository }} --body "$COMMENT"

      - name: Approve PR
        if: success() && steps.pr_details.outputs.has_automatic_label == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Approving PR #${{ matrix.pr_number }}..."
          # Note: GITHUB_TOKEN can approve PRs created by different workflows
          # This PR is created by "Auto-Update" workflow, approved by "PR Auto-Merge" workflow
          gh pr review ${{ matrix.pr_number }} --repo ${{ github.repository }} --approve --body "✅ Automated approval after successful validation checks." 2>&1 || {
            echo "Warning: Could not approve PR automatically. This may require repository settings to allow GitHub Actions to approve PRs."
            echo "Alternative: PR is ready and validated - manual approval will enable auto-merge."
            exit 0
          }
          echo "PR approved"

      - name: Enable auto-merge
        if: success() && steps.pr_details.outputs.has_automatic_label == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Enabling auto-merge for PR #${{ matrix.pr_number }}..."
          gh pr merge ${{ matrix.pr_number }} --repo ${{ github.repository }} --auto --squash --delete-branch
          echo "Auto-merge enabled (squash strategy, will merge automatically)"

      - name: Add failure comment
        if: failure() && steps.pr_details.outputs.has_automatic_label == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMENT="## ❌ Validation Failed

          One or more checks failed. Please review the workflow logs for details.

          This PR requires manual fixes before it can be merged.

          ---
          [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"

          gh pr comment ${{ matrix.pr_number }} --repo ${{ github.repository }} --body "$COMMENT"
          
          # Request review from repository owner when validation fails
          # This notifies the owner that manual intervention is needed
          echo "Requesting review from repository owner due to validation failure..."
          gh pr edit ${{ matrix.pr_number }} --repo ${{ github.repository }} --add-reviewer "${{ github.repository_owner }}" 2>&1 || \
            echo "Could not add reviewer (may already be assigned or other API limitation)"

      - name: Summary
        if: always()
        run: |
          echo "### Validation Results for ${{ steps.detect.outputs.name }} (${{ steps.detect.outputs.type }})" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "Status: ✅ Validation passed, PR approved and auto-merge enabled" >> $GITHUB_STEP_SUMMARY
            echo "The PR will be merged automatically." >> $GITHUB_STEP_SUMMARY
          else
            echo "Status: ❌ Validation failed" >> $GITHUB_STEP_SUMMARY
            echo "Repository owner has been notified. Please review the logs and fix any issues." >> $GITHUB_STEP_SUMMARY
          fi
