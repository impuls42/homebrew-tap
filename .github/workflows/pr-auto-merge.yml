# This workflow validates and automatically merges PRs with the "automatic" label
# 
# Prerequisites for full automation:
# 1. Repository Settings → Actions → General → Workflow permissions:
#    - Enable "Allow GitHub Actions to create and approve pull requests"
# 2. Repository Settings → General → Pull Requests:
#    - Enable "Allow auto-merge"
# 3. (Optional) Branch protection: Don't require approvals, or set to 0 required reviewers
#
# The workflow will still work without these settings, but will require manual approval.

name: PR Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-and-merge:
    name: Validate and Auto-Merge
    # Only run on PRs with the "automatic" label
    if: contains(github.event.pull_request.labels.*.name, 'automatic')
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Homebrew
        run: |
          echo "Homebrew already installed on macOS runner"
          brew --version

      - name: Tap this repository
        run: |
          brew tap impuls42/tap "$(pwd)"

      - name: Detect changed cask or formula
        id: detect
        run: |
          set -e

          # Get the list of changed files
          CHANGED_FILES=$(gh pr diff ${{ github.event.pull_request.number }} --name-only)
          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Find the cask or formula that was changed
          CASK_FILE=$(echo "$CHANGED_FILES" | grep -E '^Casks/.*\.rb$' | head -1 || echo "")
          FORMULA_FILE=$(echo "$CHANGED_FILES" | grep -E '^Formula/.*\.rb$' | head -1 || echo "")

          if [ -n "$CASK_FILE" ]; then
            NAME=$(basename "$CASK_FILE" .rb)
            TYPE="cask"
            AUDIT_FLAG="--cask"
          elif [ -n "$FORMULA_FILE" ]; then
            NAME=$(basename "$FORMULA_FILE" .rb)
            TYPE="formula"
            AUDIT_FLAG="--formula"
          else
            echo "ERROR: No cask or formula file found in PR changes"
            exit 1
          fi

          echo "Detected $TYPE: $NAME"
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "type=$TYPE" >> $GITHUB_OUTPUT
          echo "audit_flag=$AUDIT_FLAG" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run brew audit
        id: audit
        run: |
          set -e

          echo "Running: brew audit ${{ steps.detect.outputs.audit_flag }} ${{ steps.detect.outputs.name }}"
          echo ""

          brew audit ${{ steps.detect.outputs.audit_flag }} "${{ steps.detect.outputs.name }}"

          echo ""
          echo "Audit passed"

      - name: Run brew style
        run: |
          set -e

          echo "Running: brew style ${{ steps.detect.outputs.name }}"
          echo ""

          brew style "${{ steps.detect.outputs.name }}"

          echo ""
          echo "Style check passed"

      - name: Add success comment
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMENT="## Validation Passed

          All checks passed successfully:

          - \`brew audit ${{ steps.detect.outputs.audit_flag }} ${{ steps.detect.outputs.name }}\` - **Passed**
          - \`brew style ${{ steps.detect.outputs.name }}\` - **Passed**

          This PR will be automatically approved and merged."

          gh pr comment ${{ github.event.pull_request.number }} --body "$COMMENT"

      - name: Approve PR
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Approving PR #${{ github.event.pull_request.number }}..."
          # Note: GITHUB_TOKEN can approve PRs created by different workflows
          # This PR is created by "Auto-Update" workflow, approved by "PR Auto-Merge" workflow
          gh pr review ${{ github.event.pull_request.number }} --approve --body "✅ Automated approval after successful validation checks." 2>&1 || {
            echo "Warning: Could not approve PR automatically. This may require repository settings to allow GitHub Actions to approve PRs."
            echo "Alternative: PR is ready and validated - manual approval will enable auto-merge."
            exit 0
          }
          echo "PR approved"

      - name: Enable auto-merge
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Enabling auto-merge for PR #${{ github.event.pull_request.number }}..."
          gh pr merge ${{ github.event.pull_request.number }} --auto --squash --delete-branch
          echo "Auto-merge enabled (squash strategy, will merge automatically)"

      - name: Add failure comment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMENT="## Validation Failed

          One or more checks failed. Please review the workflow logs for details.

          This PR requires manual fixes before it can be merged."

          gh pr comment ${{ github.event.pull_request.number }} --body "$COMMENT"
          
          # Request review from repository owner when validation fails
          # This notifies the owner that manual intervention is needed
          echo "Requesting review from repository owner due to validation failure..."
          gh pr edit ${{ github.event.pull_request.number }} --add-reviewer "${{ github.repository_owner }}" 2>&1 || \
            echo "Could not add reviewer (may already be assigned or other API limitation)"

      - name: Summary
        if: always()
        run: |
          echo "### Validation Results for ${{ steps.detect.outputs.name }} (${{ steps.detect.outputs.type }})" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "Status: ✅ Validation passed, PR approved and auto-merge enabled" >> $GITHUB_STEP_SUMMARY
            echo "The PR will be merged automatically." >> $GITHUB_STEP_SUMMARY
          else
            echo "Status: ❌ Validation failed" >> $GITHUB_STEP_SUMMARY
            echo "Repository owner has been notified. Please review the logs and fix any issues." >> $GITHUB_STEP_SUMMARY
          fi
